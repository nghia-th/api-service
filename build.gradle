plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8' apply(false)
	id 'io.spring.dependency-management' version '1.1.7' apply(false)
}

group = 'vn.org.thn.service'
version = '0.0.1-SNAPSHOT'

repositories {
	mavenCentral()
}
//buildscript {
//	repositories {
//		mavenCentral()
//		gradlePluginPortal()
//	}
//}
allprojects{
	repositories {
		mavenCentral()
	}

}
subprojects {
	repositories {
		mavenCentral()
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(17)
		}
	}
}
