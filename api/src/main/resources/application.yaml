spring:
  application:
    name: quiz-service
  datasource:
    username: postgres
    password: Chuyenviet@1234
  servlet:
    multipart:
      # Nguong Spring TU CHOI truoc khi request toi duoc controller - phai LON HON gioi han nghiep
      # vu 5MB cua LessonService#uploadImage (QuizErrorCode.LESSON_IMAGE_TOO_LARGE) de check nghiep
      # vu (bao loi tieng Viet ro rang qua QUIZ_017) luon la nguoi bat truoc, khong de Spring tra ve
      # loi MaxUploadSizeExceededException chung chung (da them handler rieng o base's
      # GlobalExceptionHandler, nhung message it than thien hon).
      max-file-size: 80MB
      max-request-size: 100MB
springdoc:
  swagger-ui:
    path: /api.html
    defaultModelsExpandDepth: -1
  api-docs:
    path: /doc
mybatis:
  mapper-locations: file:./mapper/*.xml

base:
  database:
    type: POSTGRESQL              # SQLITE / POSTGRESQL / MYSQL / SQLSERVER / ORACLE (mac dinh SQLITE)
    db-name: quiz_db              # ten database thuc te (mac dinh "app")
    dbPrefix: dev                 # ghep truoc db-name -> "dev_quiz_db" (mac dinh rong "")
    sql-log: OFF                  # OFF / BASIC / FULL (mac dinh OFF)
    pool:
      max-pool-size: 5            # HikariCP (mac dinh 5) //sqlite set 1
      min-idle: 1                 # HikariCP (mac dinh 1)
    postgresql:
      host: localhost             # mac dinh localhost
      port: 5432                  # mac dinh 5432
    mysql:
      host: localhost             # mac dinh localhost (dang dung Postgres nen phan nay chua can, de tham khao)
      port: 3306                  # mac dinh 3306
    sqlserver:
      host: localhost             # mac dinh localhost
      port: 1433                  # mac dinh 1433
    oracle:
      jdbc-url: jdbc:oracle:thin:@//localhost:1521/XEPDB1  # Oracle van dung URL day du, khong tach host/port
    sqlite:
      file-name: app.db

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"

lang:
  support: vi,en
  react-build: build

# Auth (task 1, extended 2026-09-04 with refresh tokens/force-logout - see AuthService's javadoc)
# - quiz-service-only config, not part of base.
quiz:
  jwt:
    # DEV ONLY placeholder (32+ chars, required for HMAC-SHA256) - replace with a real secret
    # via an env-specific override (env var / profile) before any non-local deployment. Never
    # commit a real production secret here.
    secret: "quiz-service-dev-only-jwt-secret-change-me-32bytes-min"
    # Access token lifetime - shortened from the old 24h (`expiration-minutes`) now that a
    # refresh token exists to silently renew it (see QuizApiService.ts's 401 handler); a short
    # lifetime shrinks how long a stolen access token stays useful without costing the user
    # re-logins under normal use.
    access-token-expiration-minutes: 60
    # Refresh token lifetime - stored hashed in the refresh_token table (not a JWT, see JwtUtil),
    # rotated on every use (AuthService#refresh). A user idle longer than this must log in again.
    refresh-token-expiration-days: 30
  admin:
    # DEV ONLY placeholders, same warning as quiz.jwt.secret above - override both via an
    # env-specific config before any non-local deployment, and change the password immediately
    # after first login (there is no "change own password" endpoint yet in v1). Read once at
    # startup by AdminBootstrapRunner to create the FIRST Admin row if the admin table is still
    # empty - changing these after that first row already exists has no effect (see that class's
    # javadoc for why).
    bootstrap-email: "admin@example.com"
    bootstrap-password: "ChangeMe123!"

